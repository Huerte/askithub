{% extends "base.html" %}

{% block css %}
<style>
  .auth-container {
    background: radial-gradient(1200px 400px at 10% -20%, rgba(13,110,253,.15), transparent 50%),
                radial-gradient(1000px 400px at 110% 0%, rgba(25,135,84,.15), transparent 50%),
                linear-gradient(180deg, #0b1220 0%, #0f172a 50%, #121826 100%);
    min-height: 100vh;
    color: #e9ecef;
  }

  .auth-card {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    transition: box-shadow 0.3s ease;
    width: 100%;
    max-width: 500px;
  }

  .auth-card:hover {
    box-shadow: 0 35px 70px rgba(0, 0, 0, 0.4);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .auth-title {
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #e9ecef 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  .auth-subtitle {
    color: #94a3b8;
    font-size: 1.1rem;
    font-weight: 400;
  }

  .form-floating {
    margin-bottom: 1.5rem;
  }

  .form-floating .form-control {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: #e9ecef;
    font-size: 1rem;
    padding: 1rem 1rem;
    transition: all 0.3s ease;
  }

  .form-floating .form-control:focus {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(25, 135, 84, 0.6);
    box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
    color: #e9ecef;
  }

  .form-floating .form-control::placeholder {
    color: rgba(255, 255, 255, 0.5);
  }

  .form-floating label {
    color: #94a3b8;
    font-weight: 500;
    padding: 1rem 1rem;
  }

  .form-floating .form-control:focus ~ label,
  .form-floating .form-control:not(:placeholder-shown) ~ label {
    color: #198754;
    transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
  }

  .forgot-link {
    color: #198754;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
    display: inline-block;
    margin-bottom: 1.5rem;
  }

  .forgot-link:hover {
    color: #20c997;
    text-decoration: none;
  }

  .btn-auth {
    background: linear-gradient(135deg, #198754 0%, #20c997 100%);
    border: none;
    border-radius: 12px;
    padding: 1rem 2rem;
    font-weight: 600;
    font-size: 1.1rem;
    color: white;
    transition: all 0.3s ease;
    width: 100%;
    margin-bottom: 1.5rem;
  }

  .btn-auth:hover {
    background: linear-gradient(135deg, #20c997 0%, #198754 100%);
    box-shadow: 0 10px 25px rgba(25, 135, 84, 0.3);
    color: white;
  }

  .auth-divider {
    text-align: center;
    margin: 2rem 0;
    position: relative;
  }

  .auth-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  }

  .auth-divider span {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    padding: 0 1rem;
    color: #94a3b8;
    font-size: 0.9rem;
    position: relative;
    z-index: 1;
  }

  .signup-link {
    text-align: center;
    color: #94a3b8;
  }

  .signup-link a {
    color: #198754;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }

  .signup-link a:hover {
    color: #20c997;
    text-decoration: none;
  }

  .brand-logo {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #198754 0%, #0d6efd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  @media (max-width: 768px) {
    .auth-card {
      margin: 1rem;
      padding: 2rem 1.5rem;
    }
    
    .auth-title {
      font-size: 2rem;
    }
  }
</style>
{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<section class="auth-container d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <div class="auth-card p-4 p-md-5">
          <div class="auth-header">
            <div class="brand-logo">AskItHub</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to continue your journey</p>
          </div>

          <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-floating">
              <input type="text" class="form-control" id="username" name="username" placeholder="" required>
              <label for="username">
                <i class="bi bi-person me-2"></i>Username
              </label>
            </div>

            <div class="form-floating">
              <input type="password" class="form-control" id="password" name="password" placeholder="" required>
              <label for="password">
                <i class="bi bi-lock me-2"></i>Password
              </label>
            </div>

            <div class="text-end">
              <a href="{% url 'forgot_password' %}" class="forgot-link">
                <i class="bi bi-question-circle me-1"></i>Forgot Password?
              </a>
            </div>

            <button type="submit" class="btn btn-auth">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          
          <div class="signup-link">
            <p class="mb-0">
              New to AskItHub?
              <a href="{% url 'register-page' %}">
                <i class="bi bi-person-plus me-1"></i>Create Account
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block footer %}{% endblock %}
