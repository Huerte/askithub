{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px; 
        }
        h1 { 
            font-size: 3em; 
            color: #e63946; 
        }
        p { 
            font-size: 1.2em; 
        }
        img {
            max-width: 150px;
            height: auto;
            display: block; 
            margin: 20px auto;
        }
        a { 
            color: #457b9d; 
            text-decoration: none; 
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <img src="{% static 'images/404_img.png' %}" alt="Not Found">
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="/">Return to Home</a>
</body>
</html>
