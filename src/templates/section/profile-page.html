{% extends 'base.html' %}

{% block content %}
    <div class="container-fluid align-items-center my-3">
        <h2 class="text-center">Profile Page</h2>
        <hr>

        <div class="mt-5 d-flex justify-content-center align-items-center">
            <div class="row">
                <div class="col">
                    <img src="{{profile.avatar.url}}" alt="{{ profile.user.username }} avatar" class="img rounded-circle img-thumbnail"  width="100" height="100">
                    <h3>{{ request.user.username }}</h3>
                </div>
            </div>

            
            <div class="row">
                <div class="col">
                    <form action="{% url 'update_profile' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="input-group mb-3">
                            <input type="file" name="avatar" class="form-control" id="inputGroupFile02">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
{% endblock %}
