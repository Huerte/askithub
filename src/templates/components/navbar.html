<div class="offcanvas offcanvas-end text-bg-dark" style="width: 250px;" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasRightLabel">AskItHub</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="row mb-3">
      <div class="col">
        <a href="{% url 'profile_page' %}" class="btn btn-primary"><i class="bi bi-person-circle me-2"></i>Profile</a>
      </div>
    </div>

    <div class="row gap-2">
      <div class="col">
            {% if user and user.is_authenticated %}
              <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#logoutConfirmation">
                <i class="bi bi-box-arrow-left"></i> <span class="ms-2">Logout</span>
              </button>
            {% else %}
              <div class="row mb-3">
                <div class="col">
                  <a class="btn btn-warning" href="{% url 'login' %}">Login</a>
                </div>
              </div>

              <div class="row">
                <div class="col">
                  <a class="btn btn-warning" href="{% url 'register' %}">Sign up</a>
                </div>
              </div>
            {% endif %}
      </div>
    </div>

  </div>
</div>

<div class="modal fade" id="logoutConfirmation" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="staticBackdropLabel">Dear {{ user.username }}</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
              <p class="lead mb-4">Are you sure you want to logout?</p>
            </div>
            
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
            </div>
          </div>
        </div>
      </div>
